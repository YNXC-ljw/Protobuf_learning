// 首行：语法指定行
syntax = "proto3";
package contacks2;

message PeopleInfo
{
    string name = 1;  // 姓名
    int32 age = 2;    // 年龄
    
    message Phone{
    string number = 1;
    }
    repeated Phone phone = 3; // 电话信息
}








